<!--
@name Google Maps
@type vanilla
@icon 🗺️

Replace YOUR_GOOGLE_MAPS_API_KEY below with a key that has the Maps Embed API enabled.
-->

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, system-ui, sans-serif;
      background: Canvas;
      color: CanvasText;
    }
    main {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
      height: 100%;
      padding:
        max(12px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
    }
    form { display: flex; gap: 8px; }
    input {
      min-width: 0;
      flex: 1;
      padding: 11px 12px;
      border: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
      border-radius: 10px;
      background: Canvas;
      color: CanvasText;
      font: inherit;
    }
    button {
      padding: 11px 16px;
      border: 0;
      border-radius: 10px;
      background: #0b57d0;
      color: white;
      font: inherit;
      font-weight: 600;
    }
    .map-shell {
      position: relative;
      min-height: 240px;
      overflow: hidden;
      border-radius: 14px;
      background: color-mix(in srgb, CanvasText 8%, Canvas);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
    #setup {
      position: absolute;
      inset: 0;
      display: none;
      place-content: center;
      padding: 24px;
      text-align: center;
      line-height: 1.45;
    }
    #setup strong { display: block; margin-bottom: 6px; }
  </style>
</head>
<body>
  <main>
    <form id="search-form">
      <input
        id="search"
        type="search"
        value="Barcelona"
        placeholder="Search for a place"
        aria-label="Search Google Maps"
      >
      <button type="submit">Search</button>
    </form>

    <div class="map-shell">
      <iframe
        id="map"
        title="Google Maps"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>
      <div id="setup">
        <div>
          <strong>Google Maps API key required</strong>
          Replace <code>YOUR_GOOGLE_MAPS_API_KEY</code> in the source, then run the app again.
        </div>
      </div>
    </div>
  </main>

  <script>
    // Client-side Maps keys are visible by design. Restrict this key in Google
    // Cloud to the Maps Embed API before distributing or exporting the app.
    var GOOGLE_MAPS_API_KEY = "YOUR_GOOGLE_MAPS_API_KEY";

    var form = document.getElementById("search-form");
    var field = document.getElementById("search");
    var map = document.getElementById("map");
    var setup = document.getElementById("setup");

    function showSearch(query) {
      if (!GOOGLE_MAPS_API_KEY ||
          GOOGLE_MAPS_API_KEY === "YOUR_GOOGLE_MAPS_API_KEY") {
        map.hidden = true;
        setup.style.display = "grid";
        return;
      }

      var params = new URLSearchParams({
        key: GOOGLE_MAPS_API_KEY,
        q: query
      });
      map.src = "https://www.google.com/maps/embed/v1/search?" + params;
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      var query = field.value.trim();
      if (query) showSearch(query);
    });

    showSearch(field.value);
  </script>
</body>
</html>
